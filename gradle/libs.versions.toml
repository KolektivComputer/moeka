[versions]
clikt = "5.0.1"
detekt = "2.0.0-alpha.5"
exposed = "1.0.0"
koin-bom = "4.2.0"
koin-plugin = "1.0.1"
kord = "0.15.0"
korelibs-validate = "0.0.2"
kotlin = "2.3.21"
kotlinx-datetime = "0.6.1"
kotlinx-io = "0.9.1"
kotlinx-serialization-json = "1.7.3"
kotlinx-coroutines = "1.9.0"
ktlint = "14.0.1"
ktor = "3.5.1"
logback = "1.3.14"
maven-publish = "0.35.0"
okhttp = "5.3.0"
okio = "3.16.2"
postgres = "42.7.2"
semver = "3.1.0"
shadow = "9.0.0-beta15"
slf4j = "2.0.17"

[libraries]

clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-migration-core = { module = "org.jetbrains.exposed:exposed-migration-core", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-test = { module = "io.insert-koin:koin-test" }
koin-annotations = { module = "io.insert-koin:koin-annotations" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j" }

kord-core = { module = "dev.kord:kord-core", version.ref = "kord" }

korelibs-validate-core = { module = "cloud.kore.lib.validate:validate-core", version.ref = "korelibs-validate" }

kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

semver = { module = "io.github.z4kn4fein:semver", version.ref = "semver" }

slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
database = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-dao",
    "exposed-kotlin-datetime",
    "exposed-migration-core",
    "exposed-migration-jdbc"
]

kord = ["kord-core"]

koin = ["koin-core", "koin-test", "koin-logger-slf4j"]

ktor-server = [
    "ktor-serialization-kotlinx-json",
    "ktor-server-auth",
    "ktor-server-auth-jwt",
    "ktor-server-core",
    "ktor-server-contentNegotiation",
    "ktor-server-netty",
    "ktor-server-websockets",
    "koin-ktor",
]

okhttp = ["okhttp-core", "okhttp-coroutines"]

[plugins]
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
